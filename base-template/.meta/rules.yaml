# maury rules.yaml — classification ruleset (the learned artifact)
#
# This is an EXAMPLE seed. Edit hostnames, patterns, and reasons to
# match your own setup. Maury treats rules.yaml as source code — every
# rule should carry `added` (ISO date) and a `reason`.
#
# Three rule shapes, distinguished by which fields of `then` are populated:
#   classify  : `then.profile` set
#   forbid    : `then.forbid_profile` set (list with optional symbolic targets:
#                 '*' = all known profiles, '!name' = all except <name>)
#   scope     : `then.host_overlay` set without a `then.profile`
#
# Conditions are combined with implicit AND. At least one of `pattern`,
# `any_keyword`, `all_keywords` must be specified.

version: 1

rules:
  # ---- host & identity ---------------------------------------------------
  # These rules say "if this hostname appears in a transcript, classify
  # the surrounding context as belonging to that host." Add one entry
  # per real host you use, replacing the example below.

  - id: hostname-workstation
    when:
      pattern: '\bworkstation\b'
    then:
      profile: home
      host_overlay: workstation
    confidence: high
    priority: 10
    added: 2026-05-13
    reason: "Example: classify references to this hostname as home/workstation context"

  # ---- universal (base) preferences -------------------------------------
  # Content that should apply on every host regardless of mode lands here.

  - id: code-style-python
    when:
      any_keyword:
        - ruff
        - mypy
        - "pyproject.toml"
        - "type hint"
        - docstring
    then:
      profile: base
    confidence: high
    priority: 5
    added: 2026-05-13
    reason: "Universal Python tooling preferences apply across all profiles"

  - id: shell-conventions
    when:
      any_keyword:
        - "set -euo pipefail"
        - "unset TMOUT"
        - "shellcheck"
    then:
      profile: base
    confidence: high
    priority: 5
    added: 2026-05-13
    reason: "Shell scripting conventions universal"

  - id: commit-style
    when:
      any_keyword:
        - "Co-Authored-By"
        - "commit message"
        - "PR title"
        - "pull request"
    then:
      profile: base
    confidence: medium
    priority: 5
    added: 2026-05-13
    reason: "Git/PR style preferences are universal"

  # ---- redaction guards -------------------------------------------------
  # `forbid_profile` rules block sensitive patterns from leaking into
  # the wrong profile. Replace the placeholders below with your actual
  # home subnet, personal domain, etc.

  - id: redact-home-network
    when:
      pattern: '\b192\.168\.1\.\d{1,3}\b'
    then:
      forbid_profile: ["!home"]
    confidence: high
    priority: 100
    added: 2026-05-13
    reason: "Example: home subnet IPs must never appear in non-home profiles"

  - id: redact-personal-domain
    when:
      pattern: '\b\w+\.example\.com\b'
    then:
      forbid_profile: ["!home"]
    confidence: high
    priority: 100
    added: 2026-05-13
    reason: "Example: personal-domain hostnames are home-only — replace example.com with your domain"
