name: CI

# Per docs/testing.md: every PR + every push to devel must pass the full
# quality bar (ruff lint + ruff format + mypy --strict + pytest) on the
# OS matrix we actually target. FreeBSD is Tier 2 - runs on a self-hosted
# runner if/when one is set up; not blocking.

on:
  push:
    branches: [main, devel]
  pull_request:
    branches: [main, devel]

# Run jobs concurrently per branch; cancel any in-flight run when a new
# commit arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: "${{ matrix.os }} - py${{ matrix.python-version }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"
          enable-cache: true

      - name: "Set up Python ${{ matrix.python-version }}"
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: "ruff check (lint)"
        run: uv run ruff check src/ tests/

      - name: "ruff format --check (PEP-style formatting)"
        run: uv run ruff format --check src/ tests/

      - name: "mypy --strict (types)"
        run: uv run mypy src/ tests/

      - name: "pytest (unit tests)"
        run: uv run pytest tests/unit/ -v

      - name: "smoke - maury --version"
        run: uv run maury --version

      - name: "smoke - maury rules validate"
        run: uv run maury rules validate --rules-file base-template/.meta/rules.yaml --manifest-file base-template/.meta/manifest.json

      - name: "smoke - maury agency validate (canonical)"
        run: uv run maury agency validate --manifest-file base-template/.meta/manifest.json

      - name: "smoke - maury probe"
        run: uv run maury probe > /dev/null

      - name: "smoke - maury statusline (must exit 0 even with no identity)"
        # Per ADR-0052: the statusLine command must NEVER crash and
        # NEVER exit non-zero, even when there's no maury identity at
        # all (which is the case in CI). A maury bug here would break
        # the operator's prompt; CI catches the regression.
        run: |
          OUTPUT=$(uv run maury statusline --target /tmp/maury-statusline-smoke)
          echo "statusline output: $OUTPUT"
          test "$OUTPUT" = "(no maury identity)"
