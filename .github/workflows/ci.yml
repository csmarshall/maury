name: CI

# Per docs/testing.md: every PR + every push to devel must pass the full
# quality bar (ruff lint + ruff format + mypy --strict + pytest) on the
# OS matrix we actually target. FreeBSD is Tier 2 — runs on a self-hosted
# runner if/when one is set up; not blocking.

on:
  push:
    branches: [main, devel]
  pull_request:
    branches: [main, devel]

# Run jobs concurrently per branch; cancel any in-flight run when a new
# commit arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: ruff check (lint)
        run: uv run ruff check src/ tests/

      - name: ruff format --check (PEP-style formatting)
        run: uv run ruff format --check src/ tests/

      - name: mypy --strict (types)
        run: uv run mypy src/

      - name: pytest (unit tests)
        run: uv run pytest tests/unit/ -v

      - name: Smoke: maury --version
        run: uv run maury --version

      - name: Smoke: maury rules validate (against seed)
        run: uv run maury rules validate --rules-file base-template/.meta/rules.yaml --manifest-file base-template/.meta/manifest.json

      - name: Smoke: maury manifest validate (seed)
        run: uv run maury manifest validate --manifest-file base-template/.meta/manifest.json

      - name: Smoke: maury probe (no-op output check)
        run: uv run maury probe > /dev/null
